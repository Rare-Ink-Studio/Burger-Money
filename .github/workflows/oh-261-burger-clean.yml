name: OH 261 Burger Money clean game screen
on:
  push:
    paths:
      - .github/workflows/oh-261-burger-clean.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update complete original game, not a snippet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          p=Path('index.html');s=p.read_text()
          assert s.count('<div id="startScreen" class="screen">')==1
          before=s.index('<div id="startScreen" class="screen">');after=s.index('<div id="howScreen"',before)
          s=s[:before]+'''<div id="startScreen" class="screen"><div class="panel"><h1>🍔 Burger Money</h1><h2>Meal Quest</h2><button onclick="startGame()">Play</button><button class="blue" onclick="showHow()">How to Play</button><button class="green" onclick="showScoreboard()">Scoreboard</button></div></div>\n\n  '''+s[after:]
          s=s.replace('<div class="bm-board-heading"><span class="bm-board-icon" aria-hidden="true">🍔</span><div><div class="bm-kicker">BURGER MONEY</div><h2>HIGH SCORES <span aria-hidden="true">🏆</span></h2></div></div>','<div class="bm-board-heading"><span class="bm-game-art" aria-hidden="true"></span><h2>BURGER MONEY<br>SCOREBOARD</h2></div>')
          s=s.replace('const medals = ["🥇", "🥈", "🥉"];','const medals = ["#1", "#2", "#3"];')
          s=s.replace('<button class="bm-reset" onclick="clearBoards()">Reset Saved Boards</button>','')
          s=s.replace('🏆 Overall Score','Score').replace('⏱️ Fastest Finish','Fastest').replace('🪙 Most Money','Money').replace('☁️ Biggest Jump','Jump').replace('⚡ Best Combo','Combo')
          css='''
          /* Existing game art only; ranks 1-3 plus rows 4-10. */
          #scoreboardOverlay{background:linear-gradient(rgba(26,1,39,.56),rgba(9,0,24,.8)),url("burger_money_background.png") center/cover no-repeat;}
          #scoreboardOverlay .scorePanel{background:linear-gradient(130deg,rgba(29,4,46,.9),rgba(20,2,32,.89)),url("burger_money_background.png") center/cover no-repeat;border-color:#ffca50;}
          #scoreboardOverlay .bm-game-art{display:block;flex-shrink:0;width:90px;height:77px;border:2px solid #ffc643;border-radius:12px;background:url("burger_money_background.png") 3% 52%/330px auto no-repeat #25092f;}
          #scoreboardOverlay .bm-podium-card{background:linear-gradient(110deg,rgba(57,8,79,.74),rgba(24,2,40,.94)),url("burger_money_background.png") left bottom/530px auto no-repeat;}
          #scoreboardOverlay .bm-podium-card[data-place="1"]{background:linear-gradient(110deg,rgba(106,39,53,.67),rgba(27,4,47,.9)),url("burger_money_background.png") 3% 51%/530px auto no-repeat;}
          #scoreboardOverlay .bm-place{font-size:17px;color:#ffe079;font-weight:900;}
          #scoreboardOverlay .bm-board-heading h2{font-size:clamp(23px,4vw,36px);margin:0;color:#ffe079;line-height:1.12;}
          #scoreboardOverlay .bm-tab{font-size:13px;}
          @media(max-width:580px){#scoreboardOverlay .bm-game-art{width:58px;height:62px;background-size:250px auto;}#scoreboardOverlay .bm-podium{grid-template-columns:1fr;}#scoreboardOverlay .bm-podium-card{display:grid;grid-template-columns:37px minmax(0,1fr) auto;align-items:center;padding:9px;}#scoreboardOverlay .bm-place{font-size:15px;}#scoreboardOverlay .bm-person{margin:0;}#scoreboardOverlay .bm-value{font-size:18px;}#scoreboardOverlay .bm-meta{display:none;}}
          '''
          assert s.count('</style>')==1
          s=s.replace('</style>',css+'</style>')
          for unwanted in ['Collect burger money, climb longer scenes','Collect money and keep combos going.','Keyboard: arrows/A-D to move']:
           assert unwanted not in s,unwanted
          assert s.count('function maybeSaveScores(')==1
          p.write_text(s)
          shutil.copyfile(p,'Burger_Money_Final_Polished_Sound_Mobile.html')
          import re
          Path('/tmp/burger-game.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)))
          print('Full game pages updated, unwanted copy absent, scoreboard uses existing art')
          PY
          node --check /tmp/burger-game.js
          git add index.html Burger_Money_Final_Polished_Sound_Mobile.html
          git -c user.name='Rare Ink Studio game updates' -c user.email='actions@users.noreply.github.com' commit -m 'Burger Money: remove all intro filler and use game artwork in scoreboard'
          zip -q -r /tmp/Burger-Money-OH261-FULL.zip index.html Burger_Money_Final_Polished_Sound_Mobile.html burger_money_background.png
      - uses: actions/upload-artifact@v4
        with:
          name: Burger-Money-OH261-full-game
          path: |
            index.html
            Burger_Money_Final_Polished_Sound_Mobile.html
            burger_money_background.png
            /tmp/Burger-Money-OH261-FULL.zip
          retention-days: 14