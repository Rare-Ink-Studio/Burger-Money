name: OH 261 Burger Money Passport
on:
  push:
    paths:
      - '.github/workflows/oh-261-burger-passport.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect complete Burger Money game to One Home Passport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          needle='  const canvas = document.getElementById("game");\n  const ctx = canvas.getContext("2d");\n'
          insert='''  const canvas = document.getElementById("game");\n  const ctx = canvas.getContext("2d");\n\n  // One Home Passport bridge. The One Home access token never enters this game.\n  const GAME_KEY = "burger_money";\n  const GAME_ORIGIN = "https://rare-ink-studio.github.io";\n  const ONE_HOME_ORIGINS = new Set(["https://doodlabs.app", "https://one-home-test.netlify.app"]);\n  const SUPABASE_URL = "https://fshvettlltcujmwvikfq.supabase.co";\n  const SUPABASE_ANON_KEY = "sb_publishable_ARrX-vYhy8l-yhs6384S_g_n6214taB";\n  let passportLaunch = null;\n  let passportInfo = null;\n\n  function validPassportLaunch(data) {\n    if (!data || data.game_key !== GAME_KEY || data.target_origin !== GAME_ORIGIN) return false;\n    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(data.session_id || ""))) return false;\n    if (!/^[0-9a-f]{64}$/.test(String(data.capability || ""))) return false;\n    const exp = Date.parse(String(data.expires_at || ""));\n    return Number.isFinite(exp) && exp > Date.now() && exp <= Date.now() + 91 * 60 * 1000;\n  }\n\n  function postReady(origin) {\n    if (window.parent === window || !ONE_HOME_ORIGINS.has(origin)) return;\n    window.parent.postMessage({ type: "OH_GAME_READY", version: 1, game_key: GAME_KEY }, origin);\n  }\n\n  function requestPassportLaunch() {\n    try { postReady(new URL(document.referrer).origin); } catch (_error) {}\n  }\n\n  window.addEventListener("message", event => {\n    if (event.source !== window.parent || !ONE_HOME_ORIGINS.has(event.origin)) return;\n    const data = event.data;\n    if (data?.type === "OH_GAME_PING" && data.game_key === GAME_KEY) { postReady(event.origin); return; }\n    if (data?.type !== "OH_GAME_LAUNCH" || !validPassportLaunch(data)) return;\n    passportLaunch = Object.freeze({ game_key: GAME_KEY, target_origin: GAME_ORIGIN, session_id: String(data.session_id), capability: String(data.capability), expires_at: String(data.expires_at) });\n    passportInfo = Object.freeze({ username: String(data.passport?.username || "").slice(0,64), display_name: String(data.passport?.display_name || "").slice(0,64) });\n  });\n\n  async function submitPassportScore(stats, completed) {\n    if (!validPassportLaunch(passportLaunch)) { requestPassportLaunch(); return false; }\n    const bytes=crypto.getRandomValues(new Uint8Array(10));\n    const suffix=Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");\n    const detail={\n      money:Math.max(0,Math.min(1000000,Math.trunc(Number(stats.money)||0))),\n      time_ms:Math.max(0,Math.min(86400000,Math.trunc((Number(stats.time)||0)*1000))),\n      jump_ft:Math.max(0,Math.min(1000000,Math.trunc(Number(stats.jump)||0))),\n      combo:Math.max(0,Math.min(1000000,Math.trunc(Number(stats.combo)||0))),\n      level:Math.max(1,Math.min(4,Math.trunc(Number(stats.level)||1))),\n      completed:!!completed\n    };\n    try {\n      const response=await fetch(SUPABASE_URL+"/functions/v1/onehome-game-result",{method:"POST",mode:"cors",credentials:"omit",cache:"no-store",headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({session_id:passportLaunch.session_id,capability:passportLaunch.capability,event_id:"burger_"+Date.now()+"_"+suffix,subgame:GAME_KEY,mode:"arcade",score:Math.max(0,Math.min(1000000,Math.trunc(Number(stats.score)||0))),detail})});\n      const data=await response.json().catch(()=>({}));\n      if(!response.ok||!data.accepted)throw new Error(data.error||"Score save failed");\n      showToast("Score saved.",1400);\n      return true;\n    } catch(error) { console.error(error); showToast("Score save failed.",1600); return false; }\n  }\n\n  requestPassportLaunch();\n'''
          assert needle in s
          s=s.replace(needle,insert,1)
          old='''  function startGame() {\n    document.getElementById("startScreen").style.display = "none";'''
          new='''  function startGame() {\n    if (!validPassportLaunch(passportLaunch)) { requestPassportLaunch(); showToast("Open Burger Money from One Home.",1600); return; }\n    document.getElementById("startScreen").style.display = "none";'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    maybeSaveScores(stats);\n    document.getElementById("gameOverTitle").textContent = won ? "Meal Quest Complete!" : "Run Over!";'''
          new='''    maybeSaveScores(stats);\n    void submitPassportScore(stats, won);\n    document.getElementById("gameOverTitle").textContent = won ? "Meal Quest Complete!" : "Run Over!";'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    let name = "Player";\n    if (qualifies) {\n      name = prompt("You made a Top 10 board! Enter your name:", localStorage.getItem("burger_money_last_name") || "Player") || "Player";\n      localStorage.setItem("burger_money_last_name", name);\n    }'''
          new='''    let name = passportInfo?.display_name || passportInfo?.username || "Player";\n    if (!passportInfo && qualifies) {\n      name = prompt("You made a Top 10 board! Enter your name:", localStorage.getItem("burger_money_last_name") || "Player") || "Player";\n      localStorage.setItem("burger_money_last_name", name);\n    }'''
          assert old in s
          s=s.replace(old,new,1)
          old='''  // Cosmetic release: Passport path is activated only in the complete linked handoff.\n  const SUPABASE_URL="https://fshvettlltcujmwvikfq.supabase.co";\n  const SUPABASE_ANON_KEY="sb_publishable_ARrX-vYhy8l-yhs6384S_g_n6214taB";\n  const passportLaunch=null;\n  const validPassportLaunch=()=>false;\n  window.renderBoard = async (mode) => {'''
          assert old in s
          s=s.replace(old,'  window.renderBoard = async (mode) => {',1)
          old='''    let rows=[];\n    if (validPassportLaunch(passportLaunch)) {\n      target.textContent="Loading scores…";\n      try {\n        const resp=await fetch(SUPABASE_URL+"/rest/v1/rpc/onehome_burger_money_leaderboard",{\n          method:"POST",mode:"cors",credentials:"omit",cache:"no-store",\n          headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},\n          body:JSON.stringify({p_category:mode,p_limit:10})\n        });\n        if(!resp.ok) throw Error("Could not load scoreboard");\n        rows=await resp.json();\n        if(!Array.isArray(rows))throw Error("Could not load scoreboard");\n      }catch(error){\n        console.error(error);\n        if(state.boardMode===requestMode)target.textContent="Could not load scoreboard.";\n        return;\n      }\n      if(state.boardMode!==requestMode)return;\n    } else {\n      // Existing browser scores remain in their original storage key; no import as Passport results.\n      rows=(readBoards()[mode]||[]).slice(0,10).map((row,i)=>({\n        rank:i+1,display_name:String(row?.name||"Player"),passport_username:"",score:row?.value\n      }));\n    }'''
          new='''    let rows=[];\n    target.textContent="Loading scores…";\n    try {\n      const resp=await fetch(SUPABASE_URL+"/rest/v1/rpc/onehome_burger_money_leaderboard",{method:"POST",mode:"cors",credentials:"omit",cache:"no-store",headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_category:mode,p_limit:10})});\n      if(!resp.ok) throw Error("Could not load scoreboard");\n      rows=await resp.json();\n      if(!Array.isArray(rows))throw Error("Could not load scoreboard");\n      if(state.boardMode!==requestMode)return;\n    } catch(error) {\n      console.error(error);\n      rows=(readBoards()[mode]||[]).slice(0,10).map((row,i)=>({rank:i+1,display_name:String(row?.name||"Player"),passport_username:"",score:row?.value}));\n      if(state.boardMode!==requestMode)return;\n    }'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          Path('Burger_Money_Final_Polished_Sound_Mobile.html').write_text(s)
          scripts='\n'.join(re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s))
          Path('/tmp/burger.js').write_text(scripts)
          PY
          node --check /tmp/burger.js
          git add index.html Burger_Money_Final_Polished_Sound_Mobile.html
          git -c user.name='Rare Ink Studio game updates' -c user.email='actions@users.noreply.github.com' commit -m 'Burger Money: Passport score saving and global boards'
          git push
