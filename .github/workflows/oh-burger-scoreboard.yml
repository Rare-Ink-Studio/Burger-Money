name: Publish Burger Money diner scoreboard
on:
  push:
    paths:
      - .github/workflows/oh-burger-scoreboard.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited full-index changes
        run: |
          python3 - <<'PY'
          import base64,lzma,subprocess
          compressed=''''''
          patch=lzma.decompress(base64.b64decode(compressed)).decode()
          subprocess.run(['git','apply','--check','-'],input=patch,text=True,check=True)
          subprocess.run(['git','apply','-'],input=patch,text=True,check=True)
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'Collect burger money, climb longer scenes' not in s
          assert 'bm-podium' in s and 'bm-tab' in s
          Path('/tmp/burger-check.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/burger-check.js
      - name: Commit complete game file
        run: |
          git config user.name 'Rare Ink Studio game updates'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/onehome-board-source.yml .github/workflows/oh-burger-scoreboard.yml
          git add index.html
          git commit -m 'Burger Money: diner scoreboard and clean start screen'
          git push
      - name: Make full game download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/Burger-Money-FULL.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('.').rglob('*'):
              if p.is_file() and '.git' not in p.parts and '.github' not in p.parts:
                z.write(p,p.as_posix())
          PY
          mkdir -p /tmp/burger-handoff
          cp index.html /tmp/burger-handoff/index.html
          cp /tmp/Burger-Money-FULL.zip /tmp/burger-handoff/Burger-Money-FULL.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Burger-Money-complete-diner-scoreboard
          path: /tmp/burger-handoff/
          retention-days: 14