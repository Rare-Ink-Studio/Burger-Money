name: Burger Money Passport integration
on:
  push:
    paths: [.github/workflows/oh261-burger-passport-final.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate complete original game; test and publish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('index.html');s=p.read_text()
          def sha(t):
            b=t.encode();return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert sha(s)=='4108993817d559584831cdc8589b7345b521e147','Source changed; do not overwrite'
          bridge=Path('.github/oh261-passport-bridge.js').read_text()
          board=Path('.github/oh261-passport-board.js').read_text()
          assert 'OH_GAME_LAUNCH' in bridge and 'onehome_burger_money_leaderboard' in board
          assert s.count('  const STORE_KEY =')==1 and 'const SUPABASE_URL=' not in s
          s=s.replace('  const STORE_KEY =',bridge+'\n  const STORE_KEY =',1)
          assert s.count('  function nextLevel() {')==1 and s.count('  function startGame() {')==1
          s=s.replace('  function nextLevel() {','  function nextLevel() {\n    if(state.levelIndex<levels.length-1)void submitPassportResult(false);',1)
          s=s.replace('  function startGame() {', '''  function startGame() {
          if(!validPassportLaunch(passportLaunch)){
            try{postReady(new URL(document.referrer).origin);}catch(_e){}
            showToast("Passport connection unavailable.",1800);
            return;
          }
          lastSubmittedScore=-1;''',1)
          assert s.count('    maybeSaveScores(stats);')==1
          s=s.replace('    maybeSaveScores(stats);','    maybeSaveScores(stats);\n    void submitPassportResult(!!won);',1)
          start=s.index('    let name = "Player";'); end=s.index('    for (const [key, value, highWins] of checks)',start)
          assert 'burger_money_last_name' in s[start:end]
          s=s[:start]+'    const name=String(passportInfo?.display_name||passportInfo?.username||"Player").slice(0,64);\n\n'+s[end:]
          start=s.index('  window.renderBoard = (mode) => {');end=s.index('  window.clearBoards = () => {',start)
          s=s[:start]+board+s[end:]
          assert s.count('</style>')==1
          css='\n#scoreboardOverlay .bm-handle{font-size:12px;color:#f5d2fa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}\n#scoreboardOverlay .bm-run-handle{display:block;font-size:11px;color:#efc8f2;font-weight:400;}\n'
          s=s.replace('</style>',css+'</style>',1)
          assert s.count('function startGame()')==1 and s.count('function maybeSaveScores(stats)')==1
          assert 'Guest play' not in s and 'OH_GAME_LAUNCH' in s
          p.write_text(s)
          Path('Burger_Money_Final_Polished_Sound_Mobile.html').write_text(s)
          Path('/tmp/burger.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)))
          Path('.github/workflows/oh261-burger-passport.yml').unlink()
          print('PASS complete game: Passport link, save, leaderboard, no guest start')
          PY
          node --check /tmp/burger.js
          git add index.html Burger_Money_Final_Polished_Sound_Mobile.html .github/workflows/oh261-burger-passport.yml
          git -c user.name='Rare Ink Studio' -c user.email='actions@users.noreply.github.com' commit -m 'Burger Money: save scores to linked One Home Passport'
          git push origin HEAD:main