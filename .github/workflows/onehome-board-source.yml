name: Package Burger Money source
on:
  push:
    paths:
      - .github/workflows/onehome-board-source.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package complete game source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          with zipfile.ZipFile('/tmp/burger-money-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and '.git' not in p.parts and '.github' not in p.parts:
                      z.write(p,p.as_posix())
          print('Complete source packaged')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Burger-Money-source
          path: /tmp/burger-money-source.zip
          retention-days: 1